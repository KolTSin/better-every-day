<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Better Every Day</title>
<meta name="theme-color" content="#eef1ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Better Every Day">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first app; sticky day strip on top, tab bar at the bottom, one scrolling column of cards. */
:root{
  --bg:#eef1ee; --surface:#ffffff; --ink:#18211c; --muted:#5d6a62; --line:#d9dfda;
  --accent:#d9481e; --accent-ink:#ffffff; --food:#1f6f50; --food-soft:#e3f1ea; --train-soft:#fbe7df;
  --good:#1f7a3f; --warn:#a86400;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#1a211d; --ink:#e8eee9; --muted:#9aa89f; --line:#2c3630;
    --accent:#ff6a3d; --accent-ink:#1a0d07; --food:#5cc497; --food-soft:#1d3329; --train-soft:#3a2219;
    --good:#5fcf86; --warn:#e7a948; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --ink:#e8eee9; --muted:#9aa89f; --line:#2c3630;
  --accent:#ff6a3d; --accent-ink:#1a0d07; --food:#5cc497; --food-soft:#1d3329; --train-soft:#3a2219;
  --good:#5fcf86; --warn:#e7a948; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:0 0 calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font:700 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font:700 20px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font:600 15px/1.3 var(--body);margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.weekline{font-size:12px;color:var(--muted);text-align:right}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0;text-align:center;line-height:1.1}
.day b{display:block;font:700 18px/1.1 var(--display)}
.day span{font-size:11px;color:var(--muted);text-transform:uppercase}
.day.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day.sel span{color:inherit;opacity:.8}
.day.today:not(.sel){border-color:var(--accent);border-width:2px}
.dot{display:block;width:5px;height:5px;border-radius:50%;margin:3px auto 0;background:transparent}
.dot.gym{background:var(--accent)}
main{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.food{background:var(--food-soft);border-color:transparent;color:var(--food)}
.chip.train{background:var(--train-soft);border-color:transparent;color:var(--accent)}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)}
.timeline{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.time{font:600 17px/1.2 var(--display);font-variant-numeric:tabular-nums;color:var(--muted);padding-top:1px}
.item.gym .time,.item.cardio .time,.item.walk .time{color:var(--accent)}
.item.meal .time,.item.cook .time{color:var(--food)}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-size:16px;line-height:1}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
details{margin-top:6px}
summary{cursor:pointer;color:var(--food);font-size:13px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ "} details[open] summary::before{content:"− "}
.recipe ul,.recipe ol{margin:8px 0 0;padding-left:20px}
.recipe li{margin:2px 0}
.rate{margin-top:10px}
.rate .row{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:4px}
.rate button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 0;font-weight:600;font-variant-numeric:tabular-nums}
.rate button.on{background:var(--food);color:#fff;border-color:var(--food)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.food{background:var(--food);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg)}
.shop-group h3{font:700 15px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:4px 0 6px}
.shop-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.shop-item:first-of-type{border-top:0}
.shop-item input{width:22px;height:22px;accent-color:var(--food);flex:none}
.shop-item.done label{text-decoration:line-through;color:var(--muted)}
.shop-item label{flex:1}
.qty{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:0}
.target{font:600 15px/1.2 var(--display);color:var(--accent);letter-spacing:.02em}
.sets{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;margin-top:8px}
.sets input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.sets .lbl{font-size:12px;color:var(--muted)}
.spark{width:100%;height:56px;display:block}
.progress-row{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.progress-row:first-child{border-top:0}
.dish{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.dish:first-child{border-top:0}
.score{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.week-day{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.week-day:first-child{border-top:0}
.week-day .d{font:700 18px/1.1 var(--display);text-transform:uppercase}
.slot{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.banner{background:var(--train-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
textarea{width:100%;margin:10px 0 8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:13px/1.4 var(--body);color:var(--ink);resize:vertical}
select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.linkish{border:0;background:none;padding:0;text-align:left;color:inherit}
.linkish h3{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.item.isout h3{color:var(--muted)}
.ratebox{margin-top:8px}
.cookdish{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.how{margin:6px 0 2px}.how summary{color:var(--accent)}.how ol{margin:6px 0;padding-left:20px;font-size:14px}.how a{font-size:13px;color:var(--accent)}
body.paged{overflow:hidden}
#page{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.pagebar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.pagebody{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.ptitle{font-size:28px}
.sect{font:700 17px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:8px}
.portions{justify-content:flex-start}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:40px;height:38px;font-size:20px}
.stepper b{min-width:28px;text-align:center;font:700 20px var(--display)}
.ingl,.stepl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ingrow,.steprow{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-size:17px;line-height:1.45}
.ingrow .box{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px}
.ingrow.done,.steprow.done{opacity:.5}.ingrow.done span:last-child,.steprow.done span:last-child{text-decoration:line-through}
.ingrow.done .box{background:var(--food);border-color:var(--food);color:#fff}
.steprow .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--food);color:#fff;display:grid;place-items:center;font:700 16px var(--display)}
.editor label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}
.editor input,.editor select,.editor textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:15px var(--body);margin:0}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.ingedit{display:grid;grid-template-columns:1fr 60px 84px 34px;gap:6px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ingedit select{grid-column:1 / 4}
.stepedit{display:grid;grid-template-columns:28px 1fr 34px;gap:6px;align-items:start}
.stepedit .num{width:26px;height:26px;border-radius:50%;background:var(--food);color:#fff;display:grid;place-items:center;font:700 14px var(--display);margin-top:6px}
.x{border:1px solid var(--line);background:var(--bg);border-radius:8px;height:38px}
.edfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><h1>Better Every Day</h1><span class="weekline" id="weekline"></span></div>
    <div class="days" id="days"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="page" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Data: recipes (all dairy-free) ---------- */
const AISLES=["Produce","Meat & fish","Eggs & plant yogurt","Bread, rice & pasta","Cans & jars","Frozen","Cupboard (check first)"];
const P="Produce",M="Meat & fish",E="Eggs & plant yogurt",G="Bread, rice & pasta",C="Cans & jars",F="Frozen",SP="Cupboard (check first)";
const CATS={batch:{label:"Batch cook",portions:4},quick:{label:"Quick dinner",portions:2},weekend:{label:"Weekend dish",portions:2}};
const CAT_LABEL={batch:"Batch cook",quick:"Quick dinner",weekend:"Weekend dish",lunch:"Lunch",snack:"Snack"};
const UNITS=["g","pc","can","cans","tbsp","tsp","cloves","head","bag","thumb","slices","ml"];
const BUILTIN=[
 {id:"chili",cat:"batch",name:"Chili con carne with rice",time:"45 min",protein:38,ing:[["lean minced beef",500,"g",M],["onion",1,"pc",P],["garlic",2,"cloves",P],["carrots",1,"pc",P],["chopped tomatoes",2,"cans",C],["kidney beans",1,"can",C],["rice",300,"g",G],["chili powder",1,"tbsp",SP],["ground cumin",1,"tsp",SP]],steps:["Rinse the rice, then simmer it in 600 ml salted water with the lid on for 12 min. Turn off the heat and leave the lid on for 5 min.", "Chop the onion, crush the garlic and grate the carrot. Drain and rinse the kidney beans.", "Heat 1 tbsp oil in a large pot over medium-high heat. Add the beef and break it up with a spoon; fry 6–8 min until no pink remains.", "Add the onion, garlic and carrot; cook 4 min until soft. Stir in the chili powder, cumin, 1 tsp salt and some pepper for 1 min.", "Add the tomatoes, beans and 100 ml water. Bring to a bubble, turn the heat to low and simmer 25–30 min with the lid half on, stirring now and then.", "Taste and add salt if needed. Split chili and rice into 4 boxes. Let them cool, then refrigerate (up to 4 days) or freeze."]},
 {id:"traybake",cat:"batch",name:"Chicken & veg tray bake",time:"50 min",protein:42,ing:[["chicken thighs (boneless)",800,"g",M],["bell peppers",2,"pc",P],["red onion",1,"pc",P],["courgette",1,"pc",P],["potatoes",600,"g",P],["garlic",3,"cloves",P],["olive oil",2,"tbsp",SP],["smoked paprika",2,"tsp",SP]],steps:["Heat the oven to 200 °C (180 °C fan).", "Cut the potatoes into 2–3 cm cubes, the peppers, courgette and onion into chunks, and the chicken into large bite-size pieces.", "Spread everything on the baking tray (use two trays if it's crowded, so it roasts rather than steams). Add the oil, paprika, crushed garlic, 1 tsp salt and pepper, and mix with your hands.", "Roast 20 min, turn everything with a spatula, then roast 15–20 min more. It's done when the potatoes are soft and the chicken has no pink inside.", "Split into 4 boxes. Keeps 4 days in the fridge."]},
 {id:"curry",cat:"batch",name:"Chicken & chickpea coconut curry",time:"40 min",protein:45,ing:[["chicken breast",700,"g",M],["onion",1,"pc",P],["garlic",3,"cloves",P],["fresh ginger",1,"thumb",P],["spinach",100,"g",P],["light coconut milk",1,"can",C],["chopped tomatoes",1,"can",C],["chickpeas",1,"can",C],["rice",300,"g",G],["curry paste",3,"tbsp",SP]],steps:["Rinse the rice, then simmer it in 600 ml salted water with the lid on for 12 min. Turn off the heat and leave the lid on for 5 min.", "Chop the onion, crush the garlic, grate the ginger and cut the chicken into bite-size pieces. Drain and rinse the chickpeas.", "Heat 1 tbsp oil in a large pot over medium heat. Fry the onion 5 min, add the garlic and ginger for 1 min, then the curry paste for 1 min.", "Turn the heat up, add the chicken and stir 4–5 min until it is white on the outside.", "Pour in the coconut milk and tomatoes, add the chickpeas and ½ tsp salt. Simmer 15 min, until a cut piece of chicken has no pink inside.", "Stir in the spinach until it wilts. Split curry and rice into 4 boxes."]},
 {id:"bolognese",cat:"batch",name:"Turkey bolognese with wholewheat pasta",time:"45 min",protein:40,ing:[["minced turkey",500,"g",M],["onion",1,"pc",P],["carrots",2,"pc",P],["garlic",2,"cloves",P],["chopped tomatoes",2,"cans",C],["tomato paste",2,"tbsp",C],["wholewheat pasta",350,"g",G],["dried oregano",1,"tsp",SP]],steps:["Finely chop the onion and carrots and crush the garlic.", "Heat 1 tbsp oil in a large pot over medium heat. Cook the onion and carrot 6 min until soft, then the garlic for 1 min.", "Turn the heat up, add the turkey and break it up with a spoon; fry 6 min until no pink remains.", "Stir in the tomato paste for 1 min, then add the tomatoes, oregano, 1 tsp salt and pepper. Simmer 20–25 min with the lid half on.", "Meanwhile boil the pasta in a big pot of salted water for the time on the packet (about 10 min). Save a cup of the water, then drain.", "Mix the pasta into the sauce, loosening it with a splash of the pasta water. Split into 4 boxes."]},
 {id:"teriyaki",cat:"batch",name:"Teriyaki chicken rice bowls",time:"35 min",protein:43,ing:[["chicken thighs (boneless)",800,"g",M],["broccoli",1,"head",P],["carrots",2,"pc",P],["garlic",2,"cloves",P],["fresh ginger",1,"thumb",P],["rice",300,"g",G],["soy sauce",5,"tbsp",SP],["honey",2,"tbsp",SP],["sesame seeds",1,"tbsp",SP]],steps:["Rinse the rice, then simmer it in 600 ml salted water with the lid on for 12 min. Turn off the heat and leave the lid on for 5 min.", "Sauce: mix the soy sauce, honey, crushed garlic, grated ginger and 3 tbsp water in a cup.", "Cut the broccoli into small florets and slice the carrots thinly. Boil them 4–5 min until just tender, then drain.", "Cut the chicken into bite-size pieces. Heat 1 tbsp oil in a large frying pan over medium-high heat and fry the chicken 7–8 min until golden and cooked through (in two batches if the pan is crowded).", "Pour in the sauce and let it bubble 2–3 min, stirring, until sticky and glossy.", "Fill 4 boxes with rice, veg and chicken, and sprinkle sesame seeds on top."]},
 {id:"stew",cat:"batch",name:"Moroccan chicken & lentil stew",time:"45 min",protein:46,ing:[["chicken thighs (boneless)",700,"g",M],["onion",1,"pc",P],["carrots",2,"pc",P],["garlic",2,"cloves",P],["chopped tomatoes",1,"can",C],["red lentils",200,"g",C],["couscous",250,"g",G],["stock cube",1,"pc",SP],["ground cumin",2,"tsp",SP],["cinnamon",1,"tsp",SP]],steps:["Chop the onion and carrots, crush the garlic and cut the chicken into bite-size pieces. Rinse the lentils in a sieve.", "Heat 1 tbsp oil in a large pot over medium-high heat and brown the chicken for 5 min.", "Add the onion, carrot and garlic and cook 4 min. Stir in the cumin and cinnamon for 1 min.", "Dissolve the stock cube in 700 ml boiling water. Add it with the lentils and tomatoes, and simmer 25 min with the lid half on, stirring now and then, until the lentils are soft. Season with salt and pepper.", "Couscous: pour 300 ml boiling water over the couscous with a pinch of salt, cover for 5 min, then fluff it with a fork.", "Split stew and couscous into 4 boxes. Keeps 4 days in the fridge."]},
 {id:"burrito",cat:"batch",name:"Beef & black bean burrito bowls",time:"30 min",protein:39,ing:[["lean minced beef",500,"g",M],["red onion",1,"pc",P],["bell peppers",2,"pc",P],["lime",1,"pc",P],["black beans",1,"can",C],["sweetcorn",1,"can",C],["rice",300,"g",G],["taco spice mix (check it is dairy-free)",2,"tbsp",SP]],steps:["Rinse the rice, then simmer it in 600 ml salted water with the lid on for 12 min. Turn off the heat, leave the lid on 5 min, then stir in grated lime zest.", "Chop the onion and peppers. Drain and rinse the beans and corn.", "Heat 1 tbsp oil in a large frying pan over medium-high heat. Fry the beef 6 min, breaking it up, until no pink remains.", "Add the onion and peppers and cook 5 min. Stir in the spice mix and 100 ml water.", "Add the beans and corn and simmer 5 min until thick. Taste and add salt if needed.", "Split the rice and beef mix into 4 boxes and squeeze lime juice over."]},

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- Recipes: built-in, your own, and your edits ---------- */
function baseRecipe(id){if(id==="salad")return SALAD;return BUILTIN.find(r=>r.id===id)||SNACK_RECIPES.find(r=>r.id===id)||S.custom.find(r=>r.id===id)}
function isCustom(id){return S.custom.some(r=>r.id===id)}
function recipe(id){const e=S.edits[id];if(e&&!isCustom(id))return{...e,id,cat:baseRecipe(id)?.cat||e.cat};return baseRecipe(id)}
function allRecipes(){return BUILTIN.map(r=>recipe(r.id)).concat(S.custom)}
function yieldOf(r){return r?.yield||CATS[r?.cat]?.portions||1}
function avgRating(id){const rs=S.ratings.filter(r=>r.recipeId===id);if(!rs.length)return null;return rs.reduce((a,r)=>a+r.score,0)/rs.length}
function ratingFor(id,date,meal){const r=S.ratings.find(x=>x.recipeId===id&&x.date===date&&x.meal===meal);return r?r.score:null}

function startDate(){return S.settings?.startDate||DEFAULT_START}
function startWeek(){return wkey(parse(startDate()))}
function isStarter(wk){return wk===startWeek()}
function tpl(wk){return isStarter(wk)?STARTER:NORMAL}
function weekIndex(wk){return Math.max(0,Math.round((parse(wk)-parse(startWeek()))/(7*864e5)))}
function gymLetter(date){if(date<startDate())return null;const d=parse(date),di=d.getDay(),wk=wkey(d);
  if(isStarter(wk))return{3:"A",5:"B"}[di]||null;
  const order=weekIndex(wk)%2===1?["A","B","A"]:["B","A","B"];return{1:order[0],3:order[1],5:order[2]}[di]||null}
function setsFor(date){return (parse(date)-parse(startDate()))/864e5<7?2:3}

/* ---------- Meal planner: ratings steer choices ---------- */
function weightOf(r,prevIds){const a=avgRating(r.id);let w=a==null?6:(a<=4?0:(a-3)*(a-3));if(prevIds.has(r.id))w*=0.35;return w}
function pick(cat,exclude,prevIds,rand){
  let pool=allRecipes().filter(r=>r.cat===cat&&!exclude.has(r.id));
  let ws=pool.map(r=>weightOf(r,prevIds));
  if(ws.every(w=>w===0)){ws=pool.map(()=>1)}
  const tot=ws.reduce((a,b)=>a+b,0);let x=rand()*tot;
  for(let i=0;i<pool.length;i++){x-=ws[i];if(x<=0)return pool[i].id}
  return pool[pool.length-1]?.id;
}
function generatePlan(wk){
  const prev=S.plans[ymd(addDays(parse(wk),-7))];
  const prevIds=new Set(prev?Object.values(prev.slots):[]);
  const rand=rng(hash(wk+":"+S.ratings.length));
  const used=new Set();const slots={};
  for(const s of ["b1","b2","q1","q2","w"]){const id=pick(SLOT_CAT[s],used,prevIds,rand);slots[s]=id;used.add(id)}
  return{week:wk,slots,createdAt:new Date().toISOString()};
}
function planFor(wk){
  const p=S.plans[wk];
  if(p&&Object.values(p.slots).every(id=>recipe(id)))return p;
  const np=generatePlan(wk);if(p)for(const s in p.slots)if(recipe(p.slots[s]))np.slots[s]=p.slots[s];
  S.plans[wk]=np;persist();return np;
}

/* ---------- Which meals are eaten (eating out removes them) ---------- */
function isOut(date,meal){return !!S.days[date]?.out?.[meal]}
function weekMeals(wk){
  const T=tpl(wk),plan=planFor(wk),ws=parse(wk),out=[];
  for(let i=0;i<7;i++){const k=ymd(addDays(ws,i));if(k<startDate())continue;const first=k===startDate();
    const L=T.lunch[i],D=T.dinner[i];
    if(L)out.push({date:k,di:i,meal:"lunch",slot:L,recipeId:L==="salad"?"salad":plan.slots[L]});
    if(!first)out.push({date:k,di:i,meal:"snack",slot:"snack",recipeId:SNACK_DAYS[i]});
    if(D)out.push({date:k,di:i,meal:"dinner",slot:D,recipeId:plan.slots[D]});}
  return out.map(m=>({...m,out:isOut(m.date,m.meal)}));
}
function portionsEaten(wk,slot){return weekMeals(wk).filter(m=>m.slot===slot&&!m.out).length}
function cookDayOf(T,slot){for(const d in T.cook)if(T.cook[d].includes(slot))return +d;return null}

/* ---------- Workout progression ---------- */
function logsFor(exId,beforeDate){
  return Object.values(S.workouts).filter(w=>w.date<beforeDate&&w.entries&&w.entries[exId]&&w.entries[exId].length).sort((a,b)=>a.date<b.date?-1:1).map(w=>({date:w.date,sets:w.entries[exId]}));
}
function target(exId,date){
  const ex=EX[exId];const logs=logsFor(exId,date);const last=logs[logs.length-1];
  if(ex.type==="time"){
    if(!last)return{secs:ex.min,text:`hold ${ex.min} s`,note:"Start here and add time as it gets easier."};
    const best=Math.max(...last.sets.map(s=>s.r||0));const secs=Math.min(ex.max,Math.max(ex.min,best+ex.inc));
    return{secs,text:`hold ${secs} s`,note:best>=ex.max?"You've reached 60 s. Keep it here, or lift one foot to make it harder.":`Last best ${best} s, so add ${ex.inc} s.`};
  }
  if(ex.type==="reps"){
    if(!last)return{reps:ex.min,text:`${ex.min}–${ex.max} reps`,note:"Do as many good reps as you can, up to 15. Pick the version (floor, knees or bench) that lets you do at least 5."};
    const best=Math.max(...last.sets.map(s=>s.r||0));const aim=Math.min(ex.max,best+1);
    return{reps:aim,text:`${aim} reps`,note:last.sets.every(s=>(s.r||0)>=ex.max)?"15 on every set: switch to a harder version (from bench to knees, or knees to toes).":`Last best ${best}, so aim for ${aim}.`};
  }
  if(!last)return ex.zeroStart?{w:0,reps:ex.min,text:`no weight × ${ex.min}–${ex.max}`,note:"Start with no weight."}:{w:null,reps:ex.min,text:`${ex.min}–${ex.max} reps`,note:`First time: pick a weight you can lift ${ex.min+2} times with good form.`};
  const w=Math.max(0,...last.sets.map(s=>s.w||0));
  const reps=last.sets.map(s=>s.r||0);const wtxt=x=>x>0?`${fmtNum(x)} kg`:"no weight";
  if(reps.every(r=>r>=ex.max)){const nw=w+ex.inc;return{w:nw,reps:ex.min,up:true,text:`${wtxt(nw)} × ${ex.min}–${ex.max}`,note:`You hit ${ex.max} on every set. Up ${fmtNum(ex.inc)} kg!`}}
  const failed=reps.some(r=>r<ex.min);const prev=logs[logs.length-2];
  if(failed&&prev&&w>0){const pw=Math.max(0,...prev.sets.map(s=>s.w||0));const pf=prev.sets.some(s=>(s.r||0)<ex.min);
    if(pf&&pw===w){const nw=Math.max(0,round(w*0.9,ex.inc));return{w:nw,reps:ex.min,down:true,text:`${wtxt(nw)} × ${ex.min}–${ex.max}`,note:"Two tough sessions in a row: drop the weight a little and build back up."}}}
  const aim=Math.min(ex.max,Math.max(...reps)+1);
  return{w,reps:aim,text:`${wtxt(w)} × ${aim} reps`,note:failed?`Same weight; aim for at least ${ex.min} on every set.`:`Same weight; beat last time (best ${Math.max(...reps)}).`};
}

function applyData(d){S.settings=d.settings&&d.settings.startDate?d.settings:{startDate:DEFAULT_START};S.plans=d.plans||{};S.ratings=(d.ratings||[]).filter(r=>r&&typeof r.score==="number");S.workouts=d.workouts||{};S.days=d.days||{};S.shopping=d.shopping||{};S.custom=(d.custom||[]).filter(r=>validRecipe(r)&&CATS[r.cat]);S.edits=d.edits&&typeof d.edits==="object"?d.edits:{}}
function loadLocal(){let d=null;try{const raw=localStorage.getItem(STORE);d=raw?JSON.parse(raw):null}catch(e){storageOK=false}
  applyData(d||clone(SEED));persist();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
function save(path,data){
  const [col,id]=path.split("/");
  if(col==="plans")S.plans[id]=data;else if(col==="workouts")S.workouts[id]=data;else if(col==="days")S.days[id]=data;else if(col==="shopping")S.shopping[id]=data;
  else if(col==="ratings"){S.ratings=S.ratings.filter(r=>r._id!==id);S.ratings.push({...data,_id:id})}
  else if(col==="recipes"){S.custom=S.custom.filter(r=>r.id!==id);S.custom.push(data)}
  persist();if(!storageOK)toast("Couldn't save on this phone. Turn off private browsing.");
}
function setDay(date,patch){const cur=S.days[date]||{date};save("days/"+date,{...cur,...patch,date})}

/* ---------- Day schedule ---------- */
function schedule(date){
  if(date<startDate())return[];
  const d=parse(date),di=d.getDay(),wk=wkey(d),plan=planFor(wk),T=tpl(wk),first=date===startDate();const items=[];
  const cookedToday=slot=>(T.cook[di]||[]).includes(slot);
  const meal=(time,mealName,slot)=>{if(!slot)return;const id=slot==="salad"?"salad":plan.slots[slot];
    const sub=slot==="salad"?"Make fresh":(di===0&&!isStarter(wk)&&cookedToday(slot))?"From today's batch cook":cookedToday(slot)?"Cook fresh":"Leftovers, reheat";
    items.push({time,kind:"meal",key:mealName,title:mealName==="lunch"?"Lunch":"Dinner",recipeId:id,slot,sub,out:isOut(date,mealName)})};
  if(di===6)items.push({time:"10:00",kind:"cardio",key:"cardio",title:"Rowing",sub:"20–30 min on the rowing machine at a pace where you can still talk (or a brisk walk outside)."+(weekIndex(wk)>=2?" Try 6 × (1 min hard, 2 min easy).":"")});
  if(di===6)items.push({time:"11:00",kind:"shop",key:"shop",title:"Grocery shop: main trip",sub:"For next week: Sunday's batch cook, Tuesday's dinner and snacks to Thursday.",shopwk:ymd(addDays(parse(wk),7)),trip:1});
  if(first)items.push({time:"16:30",kind:"shop",key:"shop",title:"Grocery shop: starter trip",sub:"Day one: tonight's dinner, snacks, cupboard basics and kitchen kit.",shopwk:wk,trip:1});
  if(di===4)items.push({time:"17:30",kind:"shop",key:"shop2",title:"Grocery shop: top-up",sub:"Short trip: tonight's and Saturday's dinners, plus snacks for Friday and Saturday.",shopwk:wk,trip:2});
  if(di===0&&!first)items.push({time:"10:00",kind:"rest",key:"stretch",title:"Rest day stretch",sub:"10 min: hips, back of the legs, chest, shoulders."});
  meal("12:00","lunch",T.lunch[di]);
  if(di===2||di===4)items.push({time:"12:15",kind:"walk",key:"walk",title:"Lunch walk",sub:"30 min brisk walk."});
  if(!first)items.push({time:"15:00",kind:"snack",key:"snack",title:"Afternoon snack",recipeId:SNACK_DAYS[di],sub:"Before the gym or a long afternoon.",out:isOut(date,"snack")});
  const g=gymLetter(date);
  if(g)items.push({time:"17:30",kind:"gym",key:"gym",title:"Gym: Workout "+g,sub:(first?"First session: go light and learn each move. ":"")+"Warm up 5 min on the rower, then the 4 exercises, then 10 min easy rowing.",letter:g});
  if(di===0&&!isStarter(wk)){const dishes=["b1","b2"].filter(s=>portionsEaten(wk,s)>0);
    if(dishes.length)items.push({time:"16:00",kind:"cook",key:"batch",title:"Batch cook",sub:"Start the dish that simmers longest; prep the other while it cooks.",dishes:dishes.map(s=>({id:plan.slots[s],n:portionsEaten(wk,s)}))});}
  const dinnerTime={0:"18:30",1:"19:00",2:"18:30",3:"19:00",4:"18:30",5:"19:00",6:"18:00"}[di];
  const D=T.dinner[di];
  if(D&&cookedToday(D)&&isOut(date,"dinner")&&!(di===0&&!isStarter(wk))){const n=portionsEaten(wk,D);
    if(n>0)items.push({time:dinnerTime,kind:"cook",key:"cookahead",title:"Cook for the coming days",sub:"You're eating out tonight, but this dish covers later meals.",dishes:[{id:plan.slots[D],n}]});}
  meal(dinnerTime,"dinner",D);
  return items.sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
}

/* ---------- Shopping: only what the plan eats ---------- */
function roundBuy(q,u){if(u==="g"||u==="ml")return Math.ceil(q/10)*10;if(u==="tbsp"||u==="tsp")return Math.ceil(q*2)/2;return Math.ceil(q-1e-9)}
function normUnit(u){return /^(cans|bags|slice)$/.test(u)?(u==="slice"?"slices":u.slice(0,-1)):u==="cloves"?"clove":u}
function shoppingList(wk,trip){
  trip=trip||1;const T=tpl(wk),starter=isStarter(wk),plan=planFor(wk),map=new Map();
  const add=(n,q,u,a)=>{u=normUnit(u);const k=n+"|"+u;const cur=map.get(k);if(cur)cur.q+=q;else map.set(k,{n,q,u,a:AISLES.includes(a)?a:(a||"Produce"),k})};
  for(const s of T.trips[trip]){const r=recipe(plan.slots[s]);const n=portionsEaten(wk,s);if(!r||!n)continue;const f=n/yieldOf(r);
    r.ing.forEach(i=>add(i[0],(+i[1]||0)*f,i[2],i[3]))}
  for(const m of weekMeals(wk)){if(m.out||(m.slot!=="salad"&&m.slot!=="snack"))continue;const t=m.di<=4?1:2;if(t!==trip)continue;
    const r=recipe(m.recipeId);if(!r)continue;const f=1/yieldOf(r);r.ing.forEach(i=>add(i[0],(+i[1]||0)*f,i[2],i[3]))}
  if(starter&&trip===1){add("olive oil",1,"bottle",SP);KIT.forEach(i=>add(i[0],i[1],i[2],"Kitchen kit (skip what you own)"))}
  for(const it of map.values())it.q=roundBuy(it.q,it.u);
  const groups={};for(const it of map.values()){if(it.q>0)(groups[it.a]=groups[it.a]||[]).push(it)}
  return AISLES.concat(["Kitchen kit (skip what you own)"]).filter(a=>groups[a]).map(a=>({aisle:a,items:groups[a].sort((x,y)=>x.n.localeCompare(y.n))}));
}
function fmtBuy(i){
  if(i.u==="clove")return`1 bulb · uses ${fmtNum(i.q)} cloves`;
  if(i.u==="tbsp"||i.u==="tsp")return`uses ${fmtNum(i.q)} ${i.u}: buy if out`;
  const plural=i.q>1&&/^(can|bag|head|thumb)$/.test(i.u)?i.u+"s":i.u;return`${fmtNum(i.q)} ${plural}`;
}

function spark(points,unit){
  if(points.length<2)return`<div class="small muted">${points.length?`${fmtNum(points[0])} ${unit} logged. The chart appears after 2 sessions.`:"No sessions yet."}</div>`;
  const W=120,H=56,p=6;const mn=Math.min(...points),mx=Math.max(...points);const rg=mx-mn||1;
  const xy=points.map((v,i)=>[p+i*(W-2*p)/(points.length-1),H-p-(v-mn)/rg*(H-2*p-12)]);
  const line=xy.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");const last=xy[xy.length-1];
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend from ${fmtNum(points[0])} to ${fmtNum(points[points.length-1])} ${unit}"><path d="${line} L${last[0].toFixed(1)} ${H-p} L${p} ${H-p} Z" fill="var(--train-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent)"/><text x="${W-p}" y="10" text-anchor="end" font-size="10" fill="var(--ink)" font-family="IBM Plex Sans">${fmtNum(points[points.length-1])} ${unit}</text></svg>`;
}

  if(location.hash!=="#recipe-"+id){S.pushed=true;location.hash="recipe-"+id}else renderPage();keepAwake(true)}

window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#recipe-(.+)$/);

  else{S.page=null;S.pushed=false;keepAwake(false)}render()});
function scaleQty(q,f,u){const x=(+q||0)*f;if(f===1)return x;if(/^(g|ml)$/.test(u))return Math.round(x/5)*5;if(/^(tbsp|tsp)$/.test(u))return Math.round(x*4)/4;return Math.ceil(x*2-1e-9)/2}

function startEdit(){const r=recipe(S.page.id);S.page.form={name:r.name,time:r.time,protein:r.protein,yield:yieldOf(r),ing:clone(r.ing).map(i=>[i[0],i[1],i[2],i[3]||"Produce"]),steps:r.steps.slice()};S.page.edit=true;keepAwake(false);renderPage();$("#page").scrollTop=0}

document.addEventListener("click",e=>{

    if(!window.confirm("Delete this dish for good?"))return;S.custom=S.custom.filter(r=>r.id!==S.page.id);delete S.edits[S.page.id];persist();closeRecipe();toast("Dish deleted");return}

  // app

  if(b.dataset.go){if(b.dataset.day)S.sel=b.dataset.day;S.tab=b.dataset.go;if(b.dataset.shopwk)S.shopWeek=b.dataset.shopwk;if(b.dataset.trip)S.shopTrip=+b.dataset.trip;render();window.scrollTo(0,0);return}

  if(b.dataset.done){const k=b.dataset.done;const done={...(S.days[S.sel]?.done||{})};if(done[k])delete done[k];else done[k]=true;setDay(S.sel,{done});render();return}
  if(b.dataset.out){const k=b.dataset.out;const out={...(S.days[S.sel]?.out||{})};const was=!!out[k];if(was)delete out[k];else out[k]=true;setDay(S.sel,{out});
    toast(was?"Back on the plan":k==="snack"?"Snack skipped":"Marked as eating out. Shopping list updated.");render();return}
  if(b.dataset.rate){const score=+b.dataset.rate,id=b.dataset.r,date=b.dataset.date,meal=b.dataset.meal;save("ratings/"+id+"__"+date+"__"+meal,{recipeId:id,date,meal,score,at:new Date().toISOString()});toast("Saved "+score+"/10");render();return}

${rated}

      steps:x.steps.slice(0,10).map(s=>String(s).slice(0,400)),createdAt:new Date().toISOString()};
    save("recipes/"+id,rec);added++}
  render();const m=$("#ideamsg");if(m)m.textContent=added?`Added ${added} new dish${added>1?"es":""}. They'll start appearing in your plans.`:"No recipes found in that reply.";
}
function restoreBackup(){
  const msg=$("#backupmsg");let d;try{d=extractJSON($("#restorebox").value)}catch(e){msg.textContent="That isn't a backup from this app.";return}
  if(d.app!=="better-every-day"){msg.textContent="That isn't a backup from this app.";return}
  if(!window.confirm("Replace everything on this phone with this backup?"))return;
  applyData(d);persist();render();toast("Backup restored");
}
